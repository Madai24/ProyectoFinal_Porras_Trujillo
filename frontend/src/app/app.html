<header class="navbar">
  <div class="nav-brand">
    <a routerLink="/">🌱 Huellas Wanka</a>
  </div>
  <nav class="nav-links">
    <a routerLink="/">Reportes</a>
    @if (authService.estaAutenticado()) {
      <a routerLink="/nuevo-reporte" class="btn-primario">+ Nuevo Reporte</a>
      <a routerLink="/perfil">Mi Perfil</a>
      <button (click)="salir()" class="btn-salir">Cerrar sesión</button>
    } @else {
      <a routerLink="/login">Iniciar Sesión</a>
      <a routerLink="/registro" class="btn-primario">Registrarse</a>
    }
  </nav>
</header>

<main class="contenedor">
  <router-outlet />
</main>

<div class="avisos" aria-live="polite">
  @for (a of notificaciones.avisos(); track a.id) {
    <div class="aviso" [class.aviso-exito]="a.tipo === 'exito'" [class.aviso-error]="a.tipo === 'error'" [class.aviso-info]="a.tipo === 'info'" role="alert">
      <span class="aviso-icono">{{ a.tipo === 'exito' ? '✅' : a.tipo === 'error' ? '⚠️' : 'ℹ️' }}</span>
      <span class="aviso-texto">{{ a.texto }}</span>
      <button type="button" class="aviso-cerrar" (click)="notificaciones.cerrar(a.id)" aria-label="Cerrar">×</button>
    </div>
  }
</div>
